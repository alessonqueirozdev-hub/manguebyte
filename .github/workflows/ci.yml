name: CI

on:
  push:
    # A branch named `ci/...` runs the whole CI when pushed, so a change can
    # be checked on every system before it is merged.
    branches: [main, "ci/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # `--all-features` turns on the JACK host, whose build looks for the
      # JACK development files with pkg-config on Linux.
      - name: Install ALSA and JACK headers
        # A mirror that stops answering once held a job for six hours.
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo doc --workspace --no-deps

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # On Arm Linux C `char` is unsigned, unlike everywhere else here.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ALSA headers
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test --workspace
      # A golden image that does not match leaves the actual image and the
      # difference beside each other; keep them so a mismatch on a system
      # nobody here runs can be looked at.
      - name: Keep the golden images that did not match
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ matrix.os }}
          path: |
            target/tmp/golden-failures
            target/tmp/ui-golden-failures
            target/tmp/gui-golden-failures
          if-no-files-found: ignore

  platform-codecs:
    name: Platform codecs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Media Foundation is an optional feature of Windows Server, which
      # the Windows runner is; the tests skip, saying so, where it is
      # missing. Everywhere else a codec that cannot start fails them.
      MANGUEBYTE_SYSTEM_CODECS_OPTIONAL: ${{ matrix.os == 'windows-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The system's codecs behind `platform-codecs`: Media Foundation on
      # Windows, AudioToolbox on macOS, where this is the only build of
      # that code (the framework is developed on Windows), and none on
      # Linux, where the formats must be refused by name.
      - run: cargo clippy -p manguebyte-formats --features platform-codecs --all-targets
      - run: cargo test -p manguebyte-formats --features platform-codecs --lib --test platform -- --nocapture

  ump-output:
    name: UMP output (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # Both runners' systems have the UMP calls (macOS 14 or newer, and
      # Ubuntu 24.04's alsa-lib 1.2.11), so CoreMIDI and libasound must
      # load and every call be found; elsewhere the tests only say what is
      # missing.
      MANGUEBYTE_UMP_LIBRARY_REQUIRED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The runner's kernel may not have the sequencer's modules: the
      # loopback runs only where /dev/snd/seq appears.
      - name: Install ALSA headers and load the sequencer
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev
          sudo modprobe snd-seq-dummy || sudo modprobe snd-seq || true
          if [ -e /dev/snd/seq ]; then sudo chmod a+rw /dev/snd/seq; fi
          uname -r
          pkg-config --modversion alsa
          ls -l /dev/snd || true
      # The foreign calls of CoreMIDI and the ALSA sequencer are built only
      # on their own systems; the framework is developed on Windows, so
      # this is where they are linted.
      - run: cargo clippy -p manguebyte-ump-io -p manguebyte-devices --all-targets
      # The event list and sequencer event layouts, the libraries found at
      # run time, and on Linux a packet from one client of the test to
      # another where the sequencer is there.
      - run: cargo test -p manguebyte-ump-io -- --nocapture
      # A MIDI 2.0 note with a per-note controller, sent through the output
      # queue and thread to a UMP endpoint of the test's own (a CoreMIDI
      # virtual destination in the MIDI 2.0 protocol, an ALSA MIDI 2.0
      # client), must arrive word for word. Nothing reaches a device.
      - name: Loopback through the system's UMP output
        run: |
          if [ "$RUNNER_OS" = "Linux" ] && [ ! -e /dev/snd/seq ]; then
            echo "::notice::No ALSA sequencer on this runner (/dev/snd/seq): the UMP loopback did not run."
            exit 0
          fi
          # On macOS the receiving end is a virtual destination made with the
          # `coremidi` crate (0.9.2), whose MIDI 2.0 receive block builds a
          # `&mut T` from the connection's refcon, which CoreMIDI leaves null
          # for a virtual destination; a debug build aborts there ("null
          # reference produced"). The sending side under test is ours; the
          # loopback runs as a release build, where that check is not made.
          profile=""
          if [ "$RUNNER_OS" = "macOS" ]; then profile="--release"; fi
          cargo test $profile -p manguebyte-devices --test hardware midi_2_0_reaches -- --ignored --nocapture

  features:
    name: Without default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No audio backend and no system libraries: this is what an embedded
      # or headless user builds.
      - run: cargo test -p manguebyte --no-default-features

  miri:
    name: Miri (unsafe code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # The framework's unsafe code that handles memory is in the wait-free
      # queue, the triple buffer of the analysis crate, the CLAP and VST 3
      # wrappers, which talk to hosts through C and COM, and the plugin
      # host, which talks to plugins the same way. Miri runs their tests
      # under an interpreter that detects undefined behaviour and data
      # races. The wrapper tests drive each plugin through its binary
      # interface, so every pointer it handles is checked. The editor
      # contract has no unsafe code, but its gesture counters are shared
      # between the main and audio threads, and Miri checks those races.
      - run: cargo miri test -p manguebyte-core
        env:
          RUSTFLAGS: ""
      - run: cargo miri test -p manguebyte-plugin
        env:
          RUSTFLAGS: ""
      - run: cargo miri test -p manguebyte-clap
        env:
          RUSTFLAGS: ""
      - run: cargo miri test -p manguebyte-vst3
        env:
          RUSTFLAGS: ""
      # The LV2 wrapper meets its host through C, like the other two. Its
      # tests act as a host through the real descriptor; the one that needs
      # a variadic C function in the test host runs only outside Miri.
      - run: cargo miri test -p manguebyte-lv2
        env:
          RUSTFLAGS: ""
      - run: cargo miri test -p manguebyte-analysis --lib triple_buffer --test triple_buffer
        env:
          RUSTFLAGS: ""
      # The window crate's platform-independent parts: damage, pixel
      # conversion, pointer state, dispatch and the headless backend. The
      # Win32 backend calls the system, which Miri cannot run.
      - run: cargo miri test -p manguebyte-window --lib --test headless
        env:
          RUSTFLAGS: ""
      # The browser engine's WebAssembly exports, called natively: every
      # one of them is `unsafe extern "C"` on raw pointers from JavaScript.
      # The tests shorten their loops under Miri.
      - run: cargo miri test -p manguebyte-web --test ffi
        env:
          RUSTFLAGS: ""

  miri-host:
    name: Miri (plugin host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # The host's tests that use plugins compiled into the test itself (no
      # shared library is loaded, which Miri cannot do). Some of them leak a
      # plugin on purpose, to show what happens when one is left loaded, and
      # some check that a path with nothing at it is an error, which needs
      # the file system.
      - run: cargo miri test -p manguebyte-host --lib --test clap_hostile --test clap_edges --test vst3_hostile
        env:
          RUSTFLAGS: ""
          MIRIFLAGS: -Zmiri-ignore-leaks -Zmiri-disable-isolation

  clap:
    name: CLAP validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # clap-validator is the CLAP project's own conformance tool. It loads
      # the example plugin the way a host does and checks its descriptor,
      # ports, parameters, state and processing, with fuzzing.
      - name: Get clap-validator
        run: |
          git clone https://github.com/free-audio/clap-validator "$RUNNER_TEMP/clap-validator"
          git -C "$RUNNER_TEMP/clap-validator" checkout b2f1d9b79b1d264a5747f46707d72b1aa40a02ef
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clap-validator/target
          key: clap-validator-b2f1d9b-${{ runner.os }}
      - name: Build clap-validator
        run: cargo build --release --manifest-path "$RUNNER_TEMP/clap-validator/Cargo.toml"
        env:
          RUSTFLAGS: ""
      # An instrument and an effect with a sidechain, so that both kinds of
      # plugin go through the validator.
      - run: ./scripts/bundle-clap.sh mangue-pluck "Mangue Pluck"
      - run: ./scripts/bundle-clap.sh mangue-duck "Mangue Duck"
      # And an instrument with four auxiliary output buses.
      - run: ./scripts/bundle-clap.sh mangue-divisions "Mangue Divisions"
      - name: Validate
        run: |
          for plugin in "Mangue Pluck" "Mangue Duck" "Mangue Divisions"; do
            "$RUNNER_TEMP/clap-validator/target/release/clap-validator" validate \
              "target/bundled/$plugin.clap" | tee validation.txt
            # The tool reports failures in its summary; make them fail the job.
            grep -Eq "tests run, [0-9]+ passed, 0 failed" <(sed 's/\x1b\[[0-9;]*m//g' validation.txt)
          done

  vst3:
    name: VST 3 validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # VST 3 SDK 3.8.1.
      VST3_SDK: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The validator is Steinberg's own conformance tool, from the VST 3
      # SDK. It loads the example plugin's bundle the way a host does and
      # checks its classes, buses, parameters, units, state, MIDI mapping,
      # note expressions and processing, at many block sizes and sample
      # rates.
      - uses: actions/cache@v4
        id: validator
        with:
          path: ${{ runner.temp }}/vst3-validator
          key: vst3-validator-3cdf9ca-${{ runner.os }}-${{ runner.arch }}
      - name: Build the validator
        if: steps.validator.outputs.cache-hit != 'true'
        run: |
          sdk="$RUNNER_TEMP/vst3sdk"
          git init -q "$sdk"
          git -C "$sdk" remote add origin https://github.com/steinbergmedia/vst3sdk.git
          git -C "$sdk" fetch -q --depth 1 origin "$VST3_SDK"
          git -C "$sdk" checkout -q FETCH_HEAD
          git -C "$sdk" submodule update -q --init --depth 1 base cmake pluginterfaces public.sdk
          # The other hosting examples need a windowing toolkit and a sound
          # server. Only the validator is wanted, and it borrows some of
          # their sources, so they are left out of the build but not removed.
          rm "$sdk/public.sdk/samples/vst-hosting/editorhost/CMakeLists.txt" \
             "$sdk/public.sdk/samples/vst-hosting/audiohost/CMakeLists.txt"
          cmake -S "$sdk" -B "$sdk/build" -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
            -DSMTG_CREATE_PLUGIN_LINK=OFF -DSMTG_RUN_VST_VALIDATOR=OFF
          cmake --build "$sdk/build" --config Release --target validator --parallel 4
          mkdir -p "$RUNNER_TEMP/vst3-validator"
          find "$sdk/build" -type f \( -name validator -o -name validator.exe \) \
            -exec cp {} "$RUNNER_TEMP/vst3-validator/" \;
          ls -l "$RUNNER_TEMP/vst3-validator"
      # An instrument and an effect with a sidechain, so that both kinds of
      # plugin go through the validator.
      - run: ./scripts/bundle-vst3.sh mangue-pluck "Mangue Pluck"
      - run: ./scripts/bundle-vst3.sh mangue-duck "Mangue Duck"
      # And an instrument with four auxiliary output buses.
      - run: ./scripts/bundle-vst3.sh mangue-divisions "Mangue Divisions"
      - name: Validate
        run: |
          validator="$(find "$RUNNER_TEMP/vst3-validator" -type f -name 'validator*' | head -n 1)"
          for plugin in "Mangue Pluck" "Mangue Duck" "Mangue Divisions"; do
            "$validator" -e "target/bundled/$plugin.vst3" > validation.txt || true
            # The full log lists every parameter, the hidden ones that stand
            # for MIDI controllers included, and a line after every test.
            grep -v "Parameter [0-9]* (id=" validation.txt | grep -v "^\[Succeeded\]$" | grep -v "^$" | tail -n 60
            grep -Eq "Result: [1-9][0-9]* tests passed, 0 tests failed" validation.txt
          done

  cli:
    name: Command-line tool end to end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ALSA headers
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Generates a plugin of each kind against this checkout, builds it and
      # bundles it, which on macOS includes the ad-hoc signature.
      - run: cargo test -p cargo-mangue -- --ignored

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The browser engine and the sampler build for the web with no
      # system around them, and so do the crates under them, and the
      # facade without its device, analysis and OSC features.
      - run: cargo build -p manguebyte-web -p manguebyte-sampler --target wasm32-unknown-unknown
      - run: |
          cargo build -p manguebyte-core -p manguebyte-dsp -p manguebyte-midi \
            -p manguebyte-formats --target wasm32-unknown-unknown
          cargo build -p manguebyte --no-default-features --target wasm32-unknown-unknown
      # The sampler's module plays notes in Node.js and checks their pitch;
      # it fails if the module imports anything. A debug build, because its
      # hostile-file check relies on overflow traps.
      - run: |
          cargo build -p manguebyte-sampler --example wasm_smoke --target wasm32-unknown-unknown
          node crates/manguebyte-sampler/examples/wasm_smoke.mjs \
            target/wasm32-unknown-unknown/debug/examples/wasm_smoke.wasm
      # The engine's JavaScript (record encoder, ring, worklet, demo server)
      # against the module just built. Tests that need the module skip
      # without it, so a run that skipped any fails.
      - name: Test the engine's JavaScript
        env:
          MANGUEBYTE_WASM: target/wasm32-unknown-unknown/debug/manguebyte_web.wasm
        run: |
          test -f "$MANGUEBYTE_WASM"
          node --test --test-reporter=tap "crates/manguebyte-web/js/tests/*.test.mjs" | tee node-tests.txt
          grep -Eq "^# fail 0$" node-tests.txt
          grep -Eq "^# skipped 0$" node-tests.txt

  android:
    name: Android (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      # Builds, does not run: there is no device to run on. The audio
      # crates, the device crate on AAudio and AMidi, and the facade with
      # its default features. GitHub's Ubuntu images carry the Android NDK
      # (ANDROID_NDK_LATEST_HOME); its clang is the C compiler and linker
      # for the target. Libraries are not linked, so the API level only
      # has to be one the NDK has; 29 is the first with AMidi.
      - name: Build for aarch64-linux-android
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android29-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android29-clang"
          cargo build --target aarch64-linux-android -p manguebyte-core -p manguebyte-dsp \
            -p manguebyte-midi -p manguebyte-formats -p manguebyte-devices -p manguebyte

  ios:
    name: iOS (build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      # Builds, does not run: the device crate on CoreAudio and CoreMIDI,
      # with the SDK of the runner's Xcode.
      - run: |
          cargo build --target aarch64-apple-ios -p manguebyte-core -p manguebyte-dsp \
            -p manguebyte-midi -p manguebyte-formats -p manguebyte-devices -p manguebyte

  lv2:
    name: LV2 bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # lv2lint is not in the Ubuntu archive (docs/TECH_DEBT.md). lilv, the
      # LV2 project's host library, is: its tools find the bundles the way
      # a host does, from their Turtle files, and read every port.
      - name: Install lilv
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y lilv-utils lv2-dev
      - run: cargo run -p cargo-mangue -- mangue bundle -p mangue-pluck --format lv2 --release --out target/lv2
      - run: cargo run -p cargo-mangue -- mangue bundle -p mangue-duck --format lv2 --release --out target/lv2
      - run: cargo run -p cargo-mangue -- mangue bundle -p mangue-divisions --format lv2 --release --out target/lv2
      - name: Load the bundles with lilv
        run: |
          export LV2_PATH="$PWD/target/lv2:/usr/lib/lv2"
          lv2ls | tee plugins.txt
          for uri in urn:manguebyte:org.manguebyte.pluck urn:manguebyte:org.manguebyte.duck urn:manguebyte:org.manguebyte.divisions; do
            grep -Fxq "$uri" plugins.txt
            lv2info "$uri"
          done

  au:
    name: Audio Unit validation (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The wrapper's tests act as a host through the unit's factory and
      # methods; here they run against the system's own CoreFoundation, and
      # the wrapper is built and linked against AudioToolbox, which no other
      # job does.
      # The AU host's macOS code (AudioToolbox, CoreFoundation's property
      # lists) is linted here too: no other job compiles it.
      - run: cargo clippy -p manguebyte-au -p manguebyte-host -p mangue-pluck -p mangue-duck -p mangue-divisions --all-targets
      - run: cargo test -p manguebyte-au
      # An instrument and an effect with a sidechain, installed where hosts
      # look, so that Apple's own validator finds them by their codes.
      - run: cargo run -p cargo-mangue -- mangue install -p mangue-pluck --format au --release
      - run: cargo run -p cargo-mangue -- mangue install -p mangue-duck --format au --release
      # And an instrument with four auxiliary output elements.
      - run: cargo run -p cargo-mangue -- mangue install -p mangue-divisions --format au --release
      # auval is Apple's conformance tool, part of macOS. It loads a unit the
      # way Logic Pro and GarageBand do and checks its properties, formats,
      # parameters, state, MIDI and rendering. Any failure fails the job.
      - name: Validate with auval
        run: |
          # The system caches the units it has seen: make it look again.
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i manguebyte || true
          for bundle in "Mangue Pluck" "Mangue Duck" "Mangue Divisions"; do
            plist="$HOME/Library/Audio/Plug-Ins/Components/$bundle.component/Contents/Info.plist"
            codes=()
            for key in type subtype manufacturer; do
              codes+=("$(/usr/libexec/PlistBuddy -c "Print :AudioComponents:0:$key" "$plist")")
            done
            echo "auval -v ${codes[*]}"
            # Shown as it runs, and stopped after ten minutes, so that a unit
            # that hangs shows where.
            perl -e 'alarm shift; exec @ARGV' 600 auval -v "${codes[@]}" 2>&1 | tee auval.txt || true
            grep -q "AU VALIDATION SUCCEEDED" auval.txt
          done
      # The same check through the command-line tool, which reads the codes
      # from the bundle and judges auval's last word.
      - run: cargo run -p cargo-mangue -- mangue validate -p mangue-duck --format au --release
      # The host's side (issue #4). The in-process tests, through each unit's
      # factory, against the system's CoreFoundation. Then the installed
      # units, found with AudioComponentFindNext, made with
      # AudioComponentInstanceNew and driven through AudioToolbox: they must
      # sound as the plugins do with no host, bit for bit, and the scanner
      # must list their bundles and report a unit that crashes or hangs.
      # In release, as the units were installed; one test at a time, since
      # one of them installs fake units where the registry looks.
      - run: cargo test -p manguebyte-host --test au_pluck --test au_duck --test au_host_calls
      - run: cargo test -p manguebyte-host --release --test au_system -- --ignored --test-threads=1

  window-probe:
    name: Window probe (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Opens a child window inside a top-level window, presents a known
      # pattern and reads the pixels back from the screen (ADR 0007,
      # decision 8). It exits 0 on PASS, 1 on FAIL and 2 on CANNOT, when the
      # session cannot read windows back at all. Any of those but PASS fails
      # the job, so a runner that stops showing windows is noticed. No job
      # sets MANGUEBYTE_WINDOW_SKIP_READ_BACK: without read-back, the Win32
      # pixel tests must fail rather than pass.
      - run: cargo run -p manguebyte-window --example probe
      # Two plugin binaries in one process, each with its editor open in a
      # real window (ADR 0007, decision 7), as they ship: release bundles,
      # without the test features the debug libraries are built with.
      - run: ./scripts/bundle-clap.sh mangue-duck "Mangue Duck"
      - run: ./scripts/bundle-clap.sh mangue-pluck "Mangue Pluck"
      - run: cargo test -p mangue-duck --test two_binaries -- --ignored

  layering:
    name: Layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No crate that processes audio may depend on an interface crate
      # (gfx, ui, window, gui), with every feature and target resolved
      # (ADR 0001, ADR 0007). Only resolves dependencies; builds nothing.
      - run: bash scripts/check-layering.sh
      # Cargo puts every package's examples in one folder, so two with one
      # name overwrite each other (on Windows the second link fails).
      - name: No two examples share a name
        run: |
          cargo metadata --no-deps --format-version 1 | python3 -c '
          import collections, json, sys
          names = collections.Counter(
              target["name"]
              for package in json.load(sys.stdin)["packages"]
              for target in package["targets"]
              if "example" in target["kind"]
          )
          shared = sorted(name for name, count in names.items() if count > 1)
          print("examples:", len(names), "shared names:", shared)
          sys.exit(1 if shared else 0)
          '

  licences:
    name: Licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every dependency's licence against the list in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
      # A published crate carries only the files under its own folder, so
      # each one keeps a copy of both licence texts, identical to the root.
      # The exception is manguebyte-pro-io, under the GPLv3 alone, which
      # carries that text and neither of the others.
      - name: Every crate carries its licence texts
        run: |
          for crate in crates/*/; do
            if [ "$crate" = "crates/manguebyte-pro-io/" ]; then
              grep -q "GNU GENERAL PUBLIC LICENSE" "${crate}LICENSE"
              grep -q "Version 3, 29 June 2007" "${crate}LICENSE"
              test ! -e "${crate}LICENSE-MIT"
              test ! -e "${crate}LICENSE-APACHE"
              continue
            fi
            for licence in LICENSE-MIT LICENSE-APACHE; do
              cmp "$licence" "$crate$licence"
            done
          done

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - name: Install ALSA and JACK headers
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev
      - run: cargo check --workspace --all-targets
      # `jack` and `jack-sys`, behind the device crate's `jack` feature,
      # declare no minimum Rust version: check that they build with ours.
      - run: cargo check -p manguebyte-devices --all-targets --all-features
