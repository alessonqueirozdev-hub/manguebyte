# cargo-deny configuration. CI runs `cargo deny check licenses` with it.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Optional dependencies count: a user may turn any feature on.
all-features = true

[licenses]
# The licences a dependency may carry. Any other fails the check. A crate
# under an "A OR B" expression passes when one of its choices is here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
]
# Some of these are allowed ahead of any dependency that needs them.
unused-allowed-license = "allow"
# Unicode-3.0 is outside the licences this project accepts for anything
# that ships in a program (ADR 0007: no run-time dependency may be under
# it). `unicode-ident` is under "(MIT OR Apache-2.0) AND Unicode-3.0" and
# is reached only through `proc-macro2`, `quote` and `syn`, that is, by
# procedural macros at build time, on the systems the framework builds for
# today. cargo-deny cannot allow a licence by dependency kind, so the
# exception names the crate instead. On wasm32, which is not built yet,
# `wasm-bindgen-shared` would bring it in at run time through the web
# backends of `cpal` and `midir`; see docs/TECH_DEBT.md.
exceptions = [
    { allow = ["Unicode-3.0"], crate = "unicode-ident" },
]
# The subset of Inter that `manguebyte-gfx` embeds is under the SIL Open
# Font License. It is a file inside a workspace crate, not a dependency,
# so nothing here covers it; the README says how a program ships its text.

[licenses.private]
# The example plugins are not published; their licence is the
# workspace's anyway.
ignore = true
