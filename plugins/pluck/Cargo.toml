[package]
name = "mangue-pluck"
description = "An example CLAP and VST 3 instrument built with Manguebyte: a polyphonic plucked synth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
## Builds the example that plays the plugin on the sound card.
standalone = ["manguebyte/standalone"]

[[example]]
name = "play"
required-features = ["standalone"]

[dependencies]
manguebyte = { path = "../../crates/manguebyte", default-features = false, features = ["clap", "vst3"] }
# The smallest editor, so that a test can open two plugin binaries'
# editors in one process (ADR 0007, decision 7).
manguebyte-gui.workspace = true
manguebyte-ui.workspace = true

[dev-dependencies]
# The editor's test opens it headless, through the glue's test hook.
manguebyte-gui = { workspace = true, features = ["headless"] }
manguebyte-gfx.workspace = true

[package.metadata.manguebyte]
name = "Mangue Pluck"

[lints]
workspace = true
