[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alessonqueirozdev-hub/manguebyte"
homepage = "https://github.com/alessonqueirozdev-hub/manguebyte"
authors = ["Alesson Queiroz", "The Manguebyte contributors"]
keywords = ["audio", "dsp", "midi", "music", "realtime"]
categories = ["multimedia::audio"]

[workspace.dependencies]
manguebyte-core = { path = "crates/manguebyte-core", version = "0.1.0" }
manguebyte-params = { path = "crates/manguebyte-params", version = "0.1.0" }
manguebyte-plugin = { path = "crates/manguebyte-plugin", version = "0.1.0" }
manguebyte-clap = { path = "crates/manguebyte-clap", version = "0.1.0" }
manguebyte-graph = { path = "crates/manguebyte-graph", version = "0.1.0" }
manguebyte-standalone = { path = "crates/manguebyte-standalone", version = "0.1.0" }
manguebyte-vst3 = { path = "crates/manguebyte-vst3", version = "0.1.0" }
manguebyte-lv2 = { path = "crates/manguebyte-lv2", version = "0.1.0" }
manguebyte-midi = { path = "crates/manguebyte-midi", version = "0.1.0" }
manguebyte-dsp = { path = "crates/manguebyte-dsp", version = "0.1.0" }
manguebyte-formats = { path = "crates/manguebyte-formats", version = "0.1.0" }
manguebyte-devices = { path = "crates/manguebyte-devices", version = "0.1.0" }
manguebyte-osc = { path = "crates/manguebyte-osc", version = "0.1.0" }
manguebyte-analysis = { path = "crates/manguebyte-analysis", version = "0.1.0" }
manguebyte-host = { path = "crates/manguebyte-host", version = "0.1.0" }
manguebyte-gfx = { path = "crates/manguebyte-gfx", version = "0.1.0" }
manguebyte-ui = { path = "crates/manguebyte-ui", version = "0.1.0" }
manguebyte-window = { path = "crates/manguebyte-window", version = "0.1.0" }
manguebyte-gui = { path = "crates/manguebyte-gui", version = "0.1.0" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
