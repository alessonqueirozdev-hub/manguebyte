[package]
name = "manguebyte-window"
description = "Platform windows for the Manguebyte user interface: child windows for plugin editors, application windows and their loop, file drops and file dialogs, with a headless backend for tests and a Win32 backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# Pixmaps and integer rectangles: what a window presents and what it damages.
manguebyte-gfx.workspace = true
# The editor contract: the host's parent window, keys and modifiers.
manguebyte-plugin.workspace = true

# The Win32 declarations (ADR 0007, decision 4). 0.61.2 declares Rust 1.71
# and is already in Cargo.lock. Only the modules named here are compiled:
# the clipboard needs `DataExchange` and `Memory`, and placing an input
# method's windows at the caret needs `Ime` (functions of imm32.dll, which
# every process with windows has loaded). Application windows (ADR 0010)
# add `Com`, `Com_StructuredStorage` and `Ole` for drops and OLE's set-up,
# and `Shell` and `Shell_Common` for dropped file lists and the file
# dialogs; the COM interfaces themselves are declared in `win32::com`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# AppKit and Core Animation for the macOS backend (ADR 0028, decision 1),
# of the family of the `objc2` 0.6 already in Cargo.lock, generated from
# Apple's headers. Only the features named here are compiled; Core Graphics
# and Core Foundation make the images the view's layer shows.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSResponder",
    "NSScreen",
    "NSTextInputClient",
    "NSTextInputContext",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2",
    "CFCGTypes",
    "CFData",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2",
    "CGColorSpace",
    "CGContext",
    "CGDataProvider",
    "CGImage",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSAttributedString",
    "NSDate",
    "NSGeometry",
    "NSObjCRuntime",
    "NSObject",
    "NSRange",
    "NSRunLoop",
    "NSString",
    "NSTimer",
    "NSValue",
    "objc2-core-foundation",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "CALayer",
    "objc2-core-foundation",
] }

[features]
# Real top-level windows, pixel read-back, input injection and message
# loops for tests and probes (`win32::testing`, `macos::testing`). Never for
# a plugin.
testing = [
    "objc2-app-kit/NSApplication",
    "objc2-app-kit/NSBitmapImageRep",
    "objc2-app-kit/NSColorSpace",
    "objc2-app-kit/NSImageRep",
    "objc2-app-kit/NSRunningApplication",
    "objc2-core-graphics/CGBitmapContext",
    "objc2-core-graphics/CGEvent",
    "objc2-core-graphics/CGEventSource",
    "objc2-core-graphics/CGEventTypes",
    "objc2-foundation/NSProcessInfo",
    "objc2-quartz-core/objc2-core-graphics",
]

[dev-dependencies]
# The crate's own tests and the probe use the testing helpers.
# A path, not the workspace entry: cargo drops path-only dev-dependencies
# when it publishes, and a crate cannot depend on itself from crates.io.
manguebyte-window = { path = ".", features = ["testing"] }

# The macOS checks open real views, which AppKit allows on the process's
# first thread only, so the test has a `main` of its own.
[[test]]
name = "macos"
harness = false

# The view as a plugin binary of its own: the macOS test loads two copies of
# it into one process.
[[example]]
name = "macos_view"
crate-type = ["cdylib"]

[lints]
workspace = true
