[package]
name = "manguebyte-window"
description = "Platform windows for the Manguebyte user interface: child windows for plugin editors, application windows and their loop, file drops and file dialogs, with Win32, X11 (child windows) and headless backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# Pixmaps and integer rectangles: what a window presents and what it damages.
manguebyte-gfx.workspace = true
# The editor contract: the host's parent window, keys and modifiers.
manguebyte-plugin.workspace = true

# The Win32 declarations (ADR 0007, decision 4). 0.61.2 declares Rust 1.71
# and is already in Cargo.lock. Only the modules named here are compiled:
# the clipboard needs `DataExchange` and `Memory`, and placing an input
# method's windows at the caret needs `Ime` (functions of imm32.dll, which
# every process with windows has loaded). Application windows (ADR 0010)
# add `Com`, `Com_StructuredStorage` and `Ole` for drops and OLE's set-up,
# and `Shell` and `Shell_Common` for dropped file lists and the file
# dialogs; the COM interfaces themselves are declared in `win32::com`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# The X11 protocol (ADR 0028, decision 2), spoken by x11rb's own
# `RustConnection`: neither libX11 nor libxcb is needed to build or run.
# The one extension used is XKB, for the repeats of held keys.
# rustix, which x11rb already uses, writes to the connection's socket with
# `MSG_NOSIGNAL` (see `x11::connect`).
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", default-features = false, features = ["net", "std"] }
x11rb = { version = "0.14.0", default-features = false, features = ["xkb"] }

[features]
# Real top-level windows, pixel read-back, input injection and message
# loops for tests and probes (`win32::testing`). Never for a plugin.
testing = []

[dev-dependencies]
# The crate's own tests and the probe use the testing helpers.
# A path, not the workspace entry: cargo drops path-only dev-dependencies
# when it publishes, and a crate cannot depend on itself from crates.io.
manguebyte-window = { path = ".", features = ["testing"] }

# The X11 tests play the host over a connection of their own: they inject
# input with XTEST, wait on the window's descriptor with `poll`, and let
# `SIGPIPE` end the process while they break the window's connection.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
rustix = { version = "1", default-features = false, features = ["event", "std"] }
x11rb = { version = "0.14.0", default-features = false, features = ["xtest"] }

[lints]
workspace = true
