[package]
name = "manguebyte-ui"
description = "The Manguebyte user interface: a retained widget tree with layout, parameter gestures, accessibility and a test harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
manguebyte-core.workspace = true
# Only for `Wavetable`, whose frames the wave views show. Already a
# dependency of `manguebyte-plugin`, so nothing new is built.
manguebyte-dsp.workspace = true
manguebyte-gfx.workspace = true
manguebyte-params.workspace = true
# Only for the editor contract (`manguebyte_plugin::editor`): gestures, the
# context an editor reaches its host through, and key events. The interface
# depends on the plugin API, never the other way round.
manguebyte-plugin.workspace = true

[lints]
workspace = true
